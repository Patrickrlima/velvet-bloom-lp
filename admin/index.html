<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — Velvet Bloom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#24121b; --ink-soft:#6b5460; --velvet:#7d1f3d; --velvet-deep:#2c0b16;
    --bone:#f6efe3; --bone-deep:#efe4d4; --linha:#ddd0c4; --gold:#b08d3f;
    --ok:#1d7a4c; --erro:#a3202f;
    --raio:10px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bone);color:var(--ink);line-height:1.5;}

  /* ---------- estrutura ---------- */
  .topo{
    position:sticky;top:0;z-index:10;
    background:var(--velvet-deep);color:var(--bone);
    padding:.85rem 1rem;
    display:flex;align-items:center;gap:1rem;justify-content:space-between;
  }
  .topo h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em;}
  .topo small{display:block;font-weight:400;opacity:.7;font-size:.75rem;}
  .envolve{max-width:760px;margin:0 auto;padding:1rem 1rem 7rem;}

  /* ---------- login ---------- */
  .login{max-width:380px;margin:15vh auto;padding:0 1.25rem;text-align:center;}
  .login h1{font-size:1.5rem;margin:0 0 .35rem;}
  .login p{color:var(--ink-soft);margin:0 0 1.75rem;font-size:.95rem;}

  /* ---------- formulário ---------- */
  label{display:block;font-size:.82rem;font-weight:600;margin:0 0 .35rem;color:var(--ink-soft);}
  input[type=text],input[type=password],textarea{
    width:100%;padding:.7rem .8rem;font:inherit;font-size:1rem;
    border:1px solid var(--linha);border-radius:var(--raio);background:#fff;color:var(--ink);
  }
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent;}
  textarea{resize:vertical;min-height:4.5rem;}
  .campo{margin-bottom:1.1rem;}
  .dica{font-size:.75rem;color:var(--ink-soft);margin-top:.3rem;}

  button{
    font:inherit;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid transparent;
    padding:.7rem 1.4rem;transition:filter .2s,opacity .2s;
  }
  button:hover:not(:disabled){filter:brightness(1.08);}
  button:disabled{opacity:.55;cursor:default;}
  .bt-principal{background:var(--velvet);color:var(--bone);}
  .bt-secundario{background:transparent;border-color:var(--linha);color:var(--ink);}
  .bt-claro{background:transparent;border-color:rgba(246,239,227,.4);color:var(--bone);padding:.45rem 1rem;font-size:.85rem;}
  .largo{width:100%;}

  /* ---------- seções ---------- */
  .secao{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:.7rem;overflow:hidden;}
  .secao > summary{
    padding:.95rem 1rem;cursor:pointer;font-weight:600;list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  }
  .secao > summary::-webkit-details-marker{display:none;}
  .secao > summary::after{content:"▾";color:var(--ink-soft);transition:transform .2s;}
  .secao[open] > summary::after{transform:rotate(180deg);}
  .secao > summary:hover{background:var(--bone-deep);}
  .corpo{padding:0 1rem 1.1rem;border-top:1px solid var(--linha);padding-top:1.1rem;}
  .sub{font-size:.75rem;font-weight:400;color:var(--ink-soft);}

  /* ---------- lista de itens (frases, ocasiões...) ---------- */
  .item-lista{display:flex;gap:.5rem;margin-bottom:.5rem;align-items:flex-start;}
  .item-lista input{flex:1;}
  .bt-remover{
    background:transparent;border:1px solid var(--linha);color:var(--erro);
    padding:.55rem .75rem;border-radius:var(--raio);line-height:1;flex:none;
  }
  .bt-adicionar{background:transparent;border:1px dashed var(--linha);color:var(--ink-soft);
    padding:.5rem 1rem;font-size:.85rem;border-radius:var(--raio);}

  /* ---------- interruptor ---------- */
  .interruptor-rotulo{
    display:flex;align-items:center;gap:.65rem;cursor:pointer;
    font-size:1rem;font-weight:600;color:var(--ink);margin:0;
  }
  .interruptor-rotulo input{width:1.15rem;height:1.15rem;accent-color:var(--velvet);cursor:pointer;flex:none;}

  /* ---------- editor de preços ---------- */
  .preco-editor{
    border:1px solid var(--linha);border-radius:var(--raio);
    margin-bottom:.5rem;background:var(--bone);overflow:hidden;
  }
  .preco-editor > summary{
    padding:.7rem .85rem;cursor:pointer;list-style:none;
    display:flex;align-items:baseline;gap:.6rem;justify-content:space-between;
  }
  .preco-editor > summary::-webkit-details-marker{display:none;}
  .preco-editor > summary::after{content:"▾";color:var(--ink-soft);font-size:.8rem;flex:none;}
  .preco-editor[open] > summary::after{content:"▴";}
  .preco-editor > summary:hover{background:var(--bone-deep);}
  .preco-resumo-nome{font-weight:600;font-size:.92rem;flex:0 1 auto;min-width:0;}
  .preco-resumo-valor{
    font-size:.8rem;color:var(--velvet);text-align:right;flex:0 1 auto;min-width:0;
  }
  .preco-corpo{padding:.85rem;border-top:1px solid var(--linha);background:#fff;}
  .preco-acoes{display:flex;gap:.4rem;align-items:stretch;}
  .bt-mover{
    background:transparent;border:1px solid var(--linha);color:var(--ink-soft);
    border-radius:var(--raio);padding:.45rem .7rem;font-size:.9rem;line-height:1;flex:none;
  }
  .bt-mover:hover:not(:disabled){background:var(--bone-deep);color:var(--velvet);}
  .preco-campo{margin-bottom:.6rem;}
  .preco-campo label{font-size:.72rem;margin-bottom:.2rem;}
  .preco-previa{
    margin:.1rem 0 .7rem;padding:.5rem .6rem;
    border-left:3px solid var(--velvet);background:#fff;border-radius:4px;
    font-size:.8rem;
  }
  .preco-remover{flex:1;font-size:.8rem;padding:.45rem;}

  /* ---------- fotos ---------- */
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.7rem;}
  .foto{position:relative;border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;background:var(--bone-deep);}
  .foto img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
  .foto .trocar{
    display:block;width:100%;padding:.45rem;border:0;border-top:1px solid var(--linha);
    background:#fff;font-size:.78rem;font-weight:600;color:var(--velvet);cursor:pointer;
  }
  .foto .trocar:hover{background:var(--bone-deep);}
  .foto.enviando{opacity:.5;}

  /* ---------- barra de publicar ---------- */
  .barra{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:#fff;border-top:1px solid var(--linha);
    padding:.8rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:center;
    box-shadow:0 -6px 20px -12px rgba(0,0,0,.3);
  }
  .barra .estado{font-size:.85rem;color:var(--ink-soft);}

  /* ---------- guia de ajuda ----------
     Um modal só, com todas as explicações, e um "?" em cada seção que abre
     esse mesmo modal já na parte certa. Assim o texto de ajuda vive num lugar
     só (fácil de manter) mas chega ao usuário no contexto em que ele travou. */
  .bt-ajuda{
    background:transparent;border:1px solid rgba(246,239,227,.4);color:var(--bone);
    width:2rem;height:2rem;padding:0;font-size:1rem;line-height:1;flex:none;
  }
  .bt-ajuda-secao{
    background:transparent;border:1px solid var(--linha);color:var(--ink-soft);
    width:1.55rem;height:1.55rem;padding:0;font-size:.8rem;line-height:1;flex:none;
    font-weight:700;
  }
  .bt-ajuda-secao:hover{background:var(--bone-deep);color:var(--velvet);}
  .secao > summary > span:first-child{flex:1;min-width:0;}

  .modal-fundo{
    position:fixed;inset:0;z-index:50;
    background:rgba(44,11,22,.55);
    display:flex;align-items:center;justify-content:center;padding:1rem;
  }
  .modal{
    background:var(--bone);border-radius:14px;overflow:hidden;
    width:100%;max-width:620px;max-height:100%;
    display:flex;flex-direction:column;
    box-shadow:0 18px 50px -12px rgba(0,0,0,.45);
  }
  .modal-topo{
    background:var(--velvet-deep);color:var(--bone);
    padding:.9rem 1rem;display:flex;align-items:center;gap:1rem;justify-content:space-between;
    flex:none;
  }
  .modal-topo h2{margin:0;font-size:1rem;font-weight:600;}
  .modal-topo small{display:block;font-weight:400;opacity:.7;font-size:.75rem;}
  .modal-corpo{overflow-y:auto;padding:1rem;scroll-behavior:smooth;}

  .guia-indice{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem;}
  .guia-indice button{
    background:#fff;border:1px solid var(--linha);color:var(--ink-soft);
    border-radius:999px;padding:.32rem .7rem;font-size:.76rem;font-weight:600;
  }
  .guia-indice button:hover{border-color:var(--velvet);color:var(--velvet);}

  .guia-bloco{
    background:#fff;border:1px solid var(--linha);border-radius:var(--raio);
    padding:.9rem 1rem;margin-bottom:.7rem;scroll-margin-top:.4rem;
  }
  .guia-bloco.destaque{border-color:var(--velvet);box-shadow:0 0 0 3px rgba(125,31,61,.12);}
  .guia-bloco h3{margin:0 0 .55rem;font-size:.95rem;color:var(--velvet);}
  .guia-bloco p{margin:0 0 .55rem;font-size:.88rem;color:var(--ink-soft);}
  .guia-bloco dl{margin:0;}
  .guia-bloco dt{font-size:.85rem;font-weight:600;color:var(--ink);margin-top:.6rem;}
  .guia-bloco dt:first-child{margin-top:0;}
  .guia-bloco dd{margin:.1rem 0 0;font-size:.84rem;color:var(--ink-soft);}
  .guia-bloco .exemplo{
    display:inline-block;background:var(--bone);border-radius:5px;
    padding:.05rem .35rem;font-size:.82rem;color:var(--ink);
  }

  @media (max-width:560px){
    .modal{max-width:none;height:100%;border-radius:0;}
    .modal-fundo{padding:0;}
  }

  /* ---------- avisos ---------- */
  .aviso{padding:.7rem .9rem;border-radius:var(--raio);font-size:.9rem;margin-bottom:1rem;}
  .aviso.erro{background:#fbe9eb;color:var(--erro);border:1px solid #f0c9ce;}
  .aviso.ok{background:#e7f5ee;color:var(--ok);border:1px solid #c3e5d3;}
  .aviso.info{background:#fdf6e7;color:#7a5c1a;border:1px solid #eeddb8;}
  .oculto{display:none !important;}
  .girando{display:inline-block;width:.85em;height:.85em;border:2px solid currentColor;
    border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-1px;}
  @keyframes gira{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="telaLogin" class="login">
  <h1>Velvet Bloom</h1>
  <p>Painel de edição do site</p>
  <div id="erroLogin" class="aviso erro oculto"></div>
  <form id="formLogin">
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="bt-principal largo" id="btEntrar">Entrar</button>
  </form>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="telaPainel" class="oculto">
  <div class="topo">
    <h1>Velvet Bloom <small>Editar o site</small></h1>
    <div style="display:flex;gap:.5rem;align-items:center;">
      <button class="bt-ajuda" id="btAjuda" type="button"
              title="Como usar o painel" aria-label="Como usar o painel">?</button>
      <button class="bt-claro" id="btSair">Sair</button>
    </div>
  </div>

  <div class="envolve">
    <div id="avisoTopo" class="aviso info oculto"></div>
    <div id="secoes"></div>
  </div>

  <div class="barra">
    <span class="estado" id="estado"></span>
    <button class="bt-principal" id="btPublicar">Publicar alterações</button>
  </div>
</div>

<!-- ===================== GUIA DE AJUDA ===================== -->
<div id="modalAjuda" class="modal-fundo oculto" role="dialog" aria-modal="true"
     aria-labelledby="tituloAjuda">
  <div class="modal">
    <div class="modal-topo">
      <h2 id="tituloAjuda">Como usar o painel <small>guia rápido de todas as funções</small></h2>
      <button class="bt-claro" id="btFecharAjuda" type="button" aria-label="Fechar o guia">Fechar</button>
    </div>
    <div class="modal-corpo" id="corpoAjuda"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var conteudo = null;   // o content.json carregado
  var sha = null;        // versão do arquivo, para detectar edição simultânea
  var alterado = false;

  var el = function(id){ return document.getElementById(id); };

  /* ---------------------------------------------------------- utilidades */

  function api(caminho, opcoes){
    return fetch(caminho, Object.assign({ headers:{'Content-Type':'application/json'} }, opcoes))
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(dados){
          if(!r.ok) throw new Error(dados.erro || ('Erro ' + r.status));
          return dados;
        });
      });
  }

  function mostraAviso(caixa, tipo, texto){
    caixa.className = 'aviso ' + tipo;
    caixa.textContent = texto;
    /* O botão de publicar fica fixo no rodapé, mas o aviso nasce no topo da
       página: sem rolar até ele, o usuário clica e parece que nada aconteceu.
       Levar o aviso para a vista é o que fecha esse laço. */
    if(caixa.scrollIntoView) caixa.scrollIntoView({behavior:'smooth', block:'center'});
  }

  /* Além do aviso no topo, um resumo curto na barra fixa de baixo — é onde
     o olho já está no momento do clique. */
  function estadoBarra(tipo, texto){
    var estado = el('estado');
    estado.textContent = texto;
    estado.style.color = tipo === 'erro' ? 'var(--erro)' : (tipo === 'ok' ? 'var(--ok)' : 'var(--ink-soft)');
  }

  function marcaAlterado(){
    alterado = true;
    estadoBarra('', 'Alterações não publicadas');
  }

  /* Lê um caminho tipo "hero.subtitulo" dentro do conteúdo. */
  function pega(caminho){
    return caminho.split('.').reduce(function(o,p){ return o ? o[p] : undefined; }, conteudo);
  }
  function poe(caminho, valor){
    var partes = caminho.split('.');
    var ultimo = partes.pop();
    var alvo = partes.reduce(function(o,p){ return o[p]; }, conteudo);
    alvo[ultimo] = valor;
    marcaAlterado();
  }

  /* ---------------------------------------------------------- construção da tela */

  /* Interruptor liga/desliga. Usado para a seção de preços: desligado, ela
     nem é gerada no site. */
  function campoInterruptor(rotulo, caminho, dica, aoMudar){
    var div = document.createElement('div');
    div.className = 'campo interruptor';

    var lab = document.createElement('label');
    lab.className = 'interruptor-rotulo';

    var entrada = document.createElement('input');
    entrada.type = 'checkbox';
    entrada.checked = Boolean(pega(caminho));
    entrada.addEventListener('change', function(){
      poe(caminho, entrada.checked);
      if(aoMudar) aoMudar(entrada.checked);
    });

    var texto = document.createElement('span');
    texto.textContent = rotulo;

    lab.appendChild(entrada);
    lab.appendChild(texto);
    div.appendChild(lab);

    if(dica){
      var d = document.createElement('p');
      d.className = 'dica';
      d.textContent = dica;
      div.appendChild(d);
    }
    return div;
  }

  function campoTexto(rotulo, caminho, opcoes){
    opcoes = opcoes || {};
    var div = document.createElement('div');
    div.className = 'campo';

    var lab = document.createElement('label');
    lab.textContent = rotulo;
    div.appendChild(lab);

    var entrada = document.createElement(opcoes.longo ? 'textarea' : 'input');
    if(!opcoes.longo) entrada.type = 'text';
    entrada.value = pega(caminho) || '';
    entrada.addEventListener('input', function(){ poe(caminho, entrada.value); });
    lab.setAttribute('for', 'c_' + caminho.replace(/\./g,'_'));
    entrada.id = 'c_' + caminho.replace(/\./g,'_');
    div.appendChild(entrada);

    if(opcoes.dica){
      var d = document.createElement('p');
      d.className = 'dica';
      d.textContent = opcoes.dica;
      div.appendChild(d);
    }
    return div;
  }

  /* Lista de textos simples (frases, ocasiões, selos...) */
  function listaTextos(rotulo, caminho, dica){
    var div = document.createElement('div');
    div.className = 'campo';

    var lab = document.createElement('label');
    lab.textContent = rotulo;
    div.appendChild(lab);

    var caixa = document.createElement('div');
    div.appendChild(caixa);

    function redesenha(){
      caixa.innerHTML = '';
      var lista = pega(caminho) || [];
      lista.forEach(function(valor, i){
        var linha = document.createElement('div');
        linha.className = 'item-lista';

        var entrada = document.createElement('input');
        entrada.type = 'text';
        entrada.value = valor;
        entrada.addEventListener('input', function(){
          pega(caminho)[i] = entrada.value;
          marcaAlterado();
        });
        linha.appendChild(entrada);

        var remover = document.createElement('button');
        remover.type = 'button';
        remover.className = 'bt-remover';
        remover.textContent = '✕';
        remover.title = 'Remover';
        remover.addEventListener('click', function(){
          pega(caminho).splice(i,1);
          marcaAlterado();
          redesenha();
        });
        linha.appendChild(remover);

        caixa.appendChild(linha);
      });

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'bt-adicionar';
      add.textContent = '+ Adicionar';
      add.addEventListener('click', function(){
        pega(caminho).push('');
        marcaAlterado();
        redesenha();
      });
      caixa.appendChild(add);
    }
    redesenha();

    if(dica){
      var d = document.createElement('p');
      d.className = 'dica';
      d.textContent = dica;
      div.appendChild(d);
    }
    return div;
  }

  /* ---------------------------------------------------------- fotos */

  /* Reduz e corta a imagem no próprio navegador antes de enviar: economiza
     dados da cliente, mantém o enquadramento do site e evita depender de
     processamento de imagem pago no servidor. */
  function prepararImagem(arquivo, largura, altura){
    return new Promise(function(resolve, reject){
      var leitor = new FileReader();
      leitor.onerror = function(){ reject(new Error('Não foi possível ler a imagem.')); };
      leitor.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('Arquivo de imagem inválido.')); };
        img.onload = function(){
          var tela = document.createElement('canvas');
          tela.width = largura; tela.height = altura;
          var ctx = tela.getContext('2d');

          /* corta pelo centro, mantendo a proporção (igual ao object-fit: cover) */
          var escala = Math.max(largura / img.width, altura / img.height);
          var lFinal = img.width * escala, aFinal = img.height * escala;
          ctx.drawImage(img, (largura - lFinal)/2, (altura - aFinal)/2, lFinal, aFinal);

          var dados = tela.toDataURL('image/webp', 0.82);
          if(dados.indexOf('image/webp') === -1){        // navegador sem webp
            dados = tela.toDataURL('image/jpeg', 0.85);
          }
          resolve({
            base64: dados.split(',')[1],
            extensao: dados.indexOf('image/webp') !== -1 ? 'webp' : 'jpg',
            previa: dados
          });
        };
        img.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  /* medidas usadas em cada lugar do site */
  var MEDIDAS = {
    hero:     {largura:2000, altura:1333, descricao:'paisagem'},
    cat:      {largura:900,  altura:1230, descricao:'em pé'},
    card:     {largura:900,  altura:900,  descricao:'quadrada'},
    essencia: {largura:900,  altura:900,  descricao:'quadrada'},
    testi:    {largura:720,  altura:1130, descricao:'print de conversa'}
  };

  /* Lista de preços: cada item tem nome, detalhe e valor. Deixar o valor em
     branco é intencional — o site mostra "Sob consulta" naquele item. */
  function listaPrecos(rotulo, caminho, dica){
    var div = document.createElement('div');
    div.className = 'campo';

    var lab = document.createElement('label');
    lab.textContent = rotulo;
    div.appendChild(lab);

    if(dica){
      var d = document.createElement('p');
      d.className = 'dica';
      d.style.marginBottom = '.7rem';
      d.textContent = dica;
      div.appendChild(d);
    }

    var caixa = document.createElement('div');
    div.appendChild(caixa);

    function redesenha(){
      caixa.innerHTML = '';
      var lista = pega(caminho) || [];

      lista.forEach(function(item, i){
        /* Cada produto é uma gaveta fechada. Com 4 produtos daria no mesmo;
           com 15 é o que separa uma lista de uma rolagem infinita — a pessoa
           vê todos os nomes e preços de uma vez e abre só o que vai mexer. */
        var bloco = document.createElement('details');
        bloco.className = 'preco-editor';

        var resumo = document.createElement('summary');
        var resumoNome = document.createElement('span');
        resumoNome.className = 'preco-resumo-nome';
        var resumoValor = document.createElement('span');
        resumoValor.className = 'preco-resumo-valor';
        resumo.appendChild(resumoNome);
        resumo.appendChild(resumoValor);
        bloco.appendChild(resumo);

        var corpo = document.createElement('div');
        corpo.className = 'preco-corpo';
        bloco.appendChild(corpo);

        /* Mostra em tempo real como a linha da direita vai aparecer no site.
           É o jeito mais honesto de explicar a regra "valor antigo preenchido
           = promoção" sem um parágrafo de instruções. */
        var previa = document.createElement('p');
        previa.className = 'dica preco-previa';

        function atualizaPrevia(){
          var atual  = pega(caminho)[i];
          var moeda  = pega('precos.moeda') || 'R$';
          var deTxt  = pega('precos.rotuloDe') || 'de';
          var porTxt = pega('precos.rotuloPor') || 'por';
          var texto;
          if(!atual.valor){
            texto = pega('precos.semValor') || 'Sob consulta';
          } else if(atual.valorAntigo){
            texto = deTxt + ' ' + moeda + ' ' + atual.valorAntigo +
                    ' ' + porTxt + ' ' + moeda + ' ' + atual.valor;
          } else if(atual.prefixo){
            texto = atual.prefixo + ' ' + moeda + ' ' + atual.valor;
          } else {
            texto = moeda + ' ' + atual.valor;
          }
          previa.textContent = 'No site vai aparecer: ' + texto;
          /* o mesmo texto alimenta o resumo da gaveta fechada, para a lista
             inteira poder ser conferida sem abrir produto por produto */
          resumoNome.textContent = atual.nome || 'Produto sem nome';
          resumoValor.textContent = texto;
        }

        function linha(rotuloCampo, chave, placeholder){
          var envolve = document.createElement('div');
          envolve.className = 'preco-campo';
          var l = document.createElement('label');
          l.textContent = rotuloCampo;
          var e = document.createElement('input');
          e.type = 'text';
          e.value = item[chave] || '';
          if(placeholder) e.placeholder = placeholder;
          e.addEventListener('input', function(){
            pega(caminho)[i][chave] = e.value;
            atualizaPrevia();
            marcaAlterado();
          });
          envolve.appendChild(l);
          envolve.appendChild(e);
          return envolve;
        }

        corpo.appendChild(linha('Item', 'nome', 'Ex.: 🌹 Buquês'));
        corpo.appendChild(linha('Descrição', 'detalhe', 'Ex.: Rosas, lírios e mistos'));
        corpo.appendChild(linha('Texto antes do valor (opcional)', 'prefixo',
          'Ex.: A partir de — em branco = só o valor'));
        corpo.appendChild(linha('Valor antigo (só para promoção)', 'valorAntigo',
          'Ex.: 99,00 — em branco = sem promoção'));
        corpo.appendChild(linha('Valor', 'valor', 'Ex.: 89,00 — em branco = Sob consulta'));
        atualizaPrevia();
        corpo.appendChild(previa);

        /* Mover é o que salva a lista quando ela cresce: o produto novo nasce
           no fim, e é daqui que ele sobe até o lugar certo. */
        var acoes = document.createElement('div');
        acoes.className = 'preco-acoes';

        function mover(de, para){
          var lista = pega(caminho);
          lista.splice(para, 0, lista.splice(de, 1)[0]);
          marcaAlterado();
          redesenha();
        }

        var sobe = document.createElement('button');
        sobe.type = 'button';
        sobe.className = 'bt-mover';
        sobe.textContent = '↑';
        sobe.title = 'Subir na lista';
        sobe.setAttribute('aria-label', 'Subir este produto na lista');
        sobe.disabled = i === 0;
        sobe.addEventListener('click', function(){ mover(i, i - 1); });

        var desce = document.createElement('button');
        desce.type = 'button';
        desce.className = 'bt-mover';
        desce.textContent = '↓';
        desce.title = 'Descer na lista';
        desce.setAttribute('aria-label', 'Descer este produto na lista');
        desce.disabled = i === lista.length - 1;
        desce.addEventListener('click', function(){ mover(i, i + 1); });

        var remover = document.createElement('button');
        remover.type = 'button';
        remover.className = 'bt-remover preco-remover';
        remover.textContent = '✕ Remover produto';
        remover.addEventListener('click', function(){
          pega(caminho).splice(i,1);
          marcaAlterado();
          redesenha();
        });

        acoes.appendChild(sobe);
        acoes.appendChild(desce);
        acoes.appendChild(remover);
        corpo.appendChild(acoes);

        caixa.appendChild(bloco);
      });

      var add = document.createElement('button');
      add.type = 'button';
      add.className = 'bt-adicionar largo';
      add.textContent = '+ Adicionar produto';
      add.addEventListener('click', function(){
        pega(caminho).push({nome:'', detalhe:'', prefixo:'', valorAntigo:'', valor:''});
        marcaAlterado();
        redesenha();
        /* o produto novo nasce no fim e já abre — senão a pessoa clica em
           "adicionar" e parece que nada aconteceu */
        var gavetas = caixa.querySelectorAll('.preco-editor');
        var ultima = gavetas[gavetas.length - 1];
        if(ultima){
          ultima.open = true;
          ultima.scrollIntoView({behavior:'smooth', block:'center'});
          var primeiro = ultima.querySelector('input');
          if(primeiro) primeiro.focus();
        }
      });
      caixa.appendChild(add);
    }
    redesenha();
    return div;
  }

  function galeriaFotos(rotulo, caminho, pasta, dica){
    var div = document.createElement('div');
    div.className = 'campo';

    var lab = document.createElement('label');
    lab.textContent = rotulo;
    div.appendChild(lab);

    if(dica){
      var d = document.createElement('p');
      d.className = 'dica';
      d.style.marginBottom = '.6rem';
      d.textContent = dica;
      div.appendChild(d);
    }

    var grade = document.createElement('div');
    grade.className = 'fotos';
    div.appendChild(grade);

    (pega(caminho) || []).forEach(function(foto, i){
      var cartao = document.createElement('div');
      cartao.className = 'foto';

      var img = document.createElement('img');
      img.src = '/assets/' + foto.arquivo;
      img.alt = foto.alt || '';
      img.loading = 'lazy';
      cartao.appendChild(img);

      var botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'trocar';
      botao.textContent = 'Trocar foto';
      cartao.appendChild(botao);

      var entrada = document.createElement('input');
      entrada.type = 'file';
      entrada.accept = 'image/*';
      entrada.className = 'oculto';
      cartao.appendChild(entrada);

      botao.addEventListener('click', function(){ entrada.click(); });

      entrada.addEventListener('change', function(){
        var arquivo = entrada.files && entrada.files[0];
        if(!arquivo) return;

        cartao.classList.add('enviando');
        botao.textContent = 'Enviando…';

        var medida = MEDIDAS[pasta] || MEDIDAS.card;
        prepararImagem(arquivo, medida.largura, medida.altura)
          .then(function(pronta){
            var nome = 'foto-' + Date.now() + '.' + pronta.extensao;
            return api('/api/imagem', {
              method:'POST',
              body: JSON.stringify({ pasta: pasta, nome: nome, dadosBase64: pronta.base64 })
            }).then(function(resposta){
              pega(caminho)[i].arquivo = resposta.caminho;
              img.src = pronta.previa;
              marcaAlterado();
              botao.textContent = 'Trocar foto';
              cartao.classList.remove('enviando');
            });
          })
          .catch(function(erro){
            botao.textContent = 'Trocar foto';
            cartao.classList.remove('enviando');
            mostraAviso(el('avisoTopo'), 'erro', 'Erro ao enviar a foto: ' + erro.message);
            el('avisoTopo').classList.remove('oculto');
          });
      });

      grade.appendChild(cartao);
    });

    return div;
  }

  function montarGuia(){
    var corpo = el('corpoAjuda');
    if(corpo.dataset.pronto) return;

    var indice = document.createElement('div');
    indice.className = 'guia-indice';
    corpo.appendChild(indice);

    GUIA.forEach(function(bloco){
      var atalho = document.createElement('button');
      atalho.type = 'button';
      atalho.textContent = bloco.menu;
      atalho.addEventListener('click', function(){ iraoBloco(bloco.id); });
      indice.appendChild(atalho);

      var caixa = document.createElement('div');
      caixa.className = 'guia-bloco';
      caixa.id = 'guia-' + bloco.id;

      var h = document.createElement('h3');
      h.textContent = bloco.titulo;
      caixa.appendChild(h);

      if(bloco.intro){
        var p = document.createElement('p');
        p.textContent = bloco.intro;
        caixa.appendChild(p);
      }

      if(bloco.itens){
        var dl = document.createElement('dl');
        bloco.itens.forEach(function(par){
          var dt = document.createElement('dt');
          dt.textContent = par[0];
          var dd = document.createElement('dd');
          /* o texto é nosso, escrito aqui em cima — o HTML dos exemplos é
             intencional e não vem de lugar nenhum digitado pelo usuário */
          dd.innerHTML = par[1];
          dl.appendChild(dt);
          dl.appendChild(dd);
        });
        caixa.appendChild(dl);
      }

      if(bloco.fim){
        var pf = document.createElement('p');
        pf.style.margin = '.6rem 0 0';
        pf.textContent = bloco.fim;
        caixa.appendChild(pf);
      }

      corpo.appendChild(caixa);
    });

    corpo.dataset.pronto = '1';
  }

  function iraoBloco(id){
    var alvo = el('guia-' + id);
    if(!alvo) return;
    Array.prototype.forEach.call(
      document.querySelectorAll('.guia-bloco.destaque'),
      function(n){ n.classList.remove('destaque'); }
    );
    alvo.classList.add('destaque');
    alvo.scrollIntoView({block:'start'});
  }

  function abrirAjuda(id){
    montarGuia();
    el('modalAjuda').classList.remove('oculto');
    document.body.style.overflow = 'hidden';
    if(id){ iraoBloco(id); }
    else { el('corpoAjuda').scrollTop = 0; }
    el('btFecharAjuda').focus();
  }

  function fecharAjuda(){
    el('modalAjuda').classList.add('oculto');
    document.body.style.overflow = '';
  }

  el('btAjuda').addEventListener('click', function(){ abrirAjuda(); });
  el('btFecharAjuda').addEventListener('click', fecharAjuda);
  el('modalAjuda').addEventListener('click', function(evento){
    if(evento.target === el('modalAjuda')) fecharAjuda();   // clique fora fecha
  });
  document.addEventListener('keydown', function(evento){
    if(evento.key === 'Escape' && !el('modalAjuda').classList.contains('oculto')) fecharAjuda();
  });

  /* Na primeira vez que alguém entra neste navegador, o guia abre sozinho.
     Depois disso nunca mais — fica o "?" no topo. O try/catch é porque
     navegador em aba anônima pode recusar o armazenamento. */
  function talvezAbrirNaPrimeiraVez(){
    var chave = 'vb-guia-visto';
    try{
      if(localStorage.getItem(chave)) return;
      localStorage.setItem(chave, '1');
    }catch(e){ return; }
    abrirAjuda();
  }

  function secao(titulo, subtitulo, montar, ajudaId){
    var det = document.createElement('details');
    det.className = 'secao';

    var sum = document.createElement('summary');
    sum.innerHTML = '<span>' + titulo + (subtitulo ? ' <span class="sub">— ' + subtitulo + '</span>' : '') + '</span>';

    /* O "?" da seção abre o guia já na explicação daquela seção. Precisa
       cancelar o clique: dentro de um <summary>, qualquer clique abriria ou
       fecharia a seção, e o usuário perderia de vista o que estava fazendo. */
    if(ajudaId){
      var ajuda = document.createElement('button');
      ajuda.type = 'button';
      ajuda.className = 'bt-ajuda-secao';
      ajuda.textContent = '?';
      ajuda.title = 'O que dá para editar aqui';
      ajuda.setAttribute('aria-label', 'Ajuda sobre a seção ' + titulo);
      ajuda.addEventListener('click', function(evento){
        evento.preventDefault();
        evento.stopPropagation();
        abrirAjuda(ajudaId);
      });
      sum.appendChild(ajuda);
    }

    det.appendChild(sum);

    var corpo = document.createElement('div');
    corpo.className = 'corpo';
    det.appendChild(corpo);

    /* monta o conteúdo só ao abrir pela primeira vez — deixa a tela leve */
    var montado = false;
    det.addEventListener('toggle', function(){
      if(det.open && !montado){ montar(corpo); montado = true; }
    });

    return det;
  }

  /* ---------------------------------------------------------- publicar */

  function publicar(){
    var botao = el('btPublicar');
    var estado = el('estado');
    botao.disabled = true;
    estado.innerHTML = '<span class="girando"></span> Publicando…';

    api('/api/conteudo', { method:'POST', body: JSON.stringify({ conteudo: conteudo, sha: sha }) })
      .then(function(){
        alterado = false;
        estadoBarra('ok', '✓ Publicado');
        mostraAviso(el('avisoTopo'), 'ok',
          'Publicado! O site fica atualizado em cerca de 1 minuto. Pode fechar esta página.');
        el('avisoTopo').classList.remove('oculto');
        /* recarrega o sha para permitir salvar de novo em seguida */
        return api('/api/conteudo').then(function(dados){ sha = dados.sha; });
      })
      .catch(function(erro){
        estadoBarra('erro', 'Não publicou — veja o aviso acima');
        mostraAviso(el('avisoTopo'), 'erro', erro.message);
        el('avisoTopo').classList.remove('oculto');
      })
      .then(function(){ botao.disabled = false; });
  }

  /* ---------------------------------------------------------- entrada */

  function abrirPainel(){
    el('telaLogin').classList.add('oculto');
    el('telaPainel').classList.remove('oculto');

    api('/api/conteudo')
      .then(function(dados){
        conteudo = dados.conteudo;
        sha = dados.sha;
        montarPainel();
        talvezAbrirNaPrimeiraVez();
      })
      .catch(function(erro){
        mostraAviso(el('avisoTopo'), 'erro', 'Não foi possível carregar o conteúdo: ' + erro.message);
        el('avisoTopo').classList.remove('oculto');
      });
  }

  el('formLogin').addEventListener('submit', function(evento){
    evento.preventDefault();
    var botao = el('btEntrar');
    var erro = el('erroLogin');
    erro.classList.add('oculto');
    botao.disabled = true;
    botao.innerHTML = '<span class="girando"></span> Entrando…';

    api('/api/login', { method:'POST', body: JSON.stringify({ senha: el('senha').value }) })
      .then(abrirPainel)
      .catch(function(e){
        mostraAviso(erro, 'erro', e.message);
        erro.classList.remove('oculto');
      })
      .then(function(){
        botao.disabled = false;
        botao.textContent = 'Entrar';
      });
  });

  el('btPublicar').addEventListener('click', publicar);

  el('btSair').addEventListener('click', function(){
    api('/api/sair', {method:'POST'}).then(function(){ location.reload(); });
  });

  /* avisa se sair com alteração pendente */
  window.addEventListener('beforeunload', function(evento){
    if(alterado){ evento.preventDefault(); evento.returnValue = ''; }
  });

  /* já está logado? */
  api('/api/sessao')
    .then(function(dados){ if(dados.autenticado) abrirPainel(); })
    .catch(function(){ /* painel ainda não configurado — mostra o login mesmo assim */ });
})();
